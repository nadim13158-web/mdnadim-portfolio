  <body>
    <div id="root"></div>

    <!--
      NETLIFY FORM (delete korben na)
      Lukano form — Netlify er robot eta dekhe bujhe site e ekta form ache.
      Asol form ta React er bhitore; message sorasori Netlify -> apnar email e jay.
      Netlify te ekbar: Forms -> "Enable form detection", tarpor abar deploy.
    -->
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="gotcha" hidden>
      <input type="hidden" name="subject" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="budget" />
      <textarea name="message"></textarea>
      <input type="text" name="gotcha" />
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
